# Cloud Build CI/CD pipeline for InsurBot
#
# Trigger: push to main branch
# Steps:
#   1. Install dependencies and run unit tests
#   2. Build Docker image
#   3. Push image to Artifact Registry
#   4. Deploy to Cloud Run
#
# Required substitutions (set in Cloud Build trigger):
#   _PROJECT_ID   - GCP project ID
#   _REGION       - Cloud Run region (default: us-central1)
#   _REGISTRY     - Artifact Registry host (e.g. us-central1-docker.pkg.dev)
#   _REPO         - Artifact Registry repository name (e.g. insurbot)
#   _SERVICE_NAME - Cloud Run service name (e.g. insurbot-api)

substitutions:
  _REGION: us-central1
  _SERVICE_NAME: insurbot-api
  _REGISTRY: us-central1-docker.pkg.dev
  _REPO: insurbot

options:
  logging: CLOUD_LOGGING_ONLY
  machineType: E2_HIGHCPU_8

steps:
  # ------------------------------------------------------------------
  # Step 1: Run unit tests
  # ------------------------------------------------------------------
  - name: python:3.11-slim
    id: unit-tests
    entrypoint: bash
    args:
      - -c
      - |
        pip install --quiet -r requirements.txt
        python -m pytest tests/unit/ -v --tb=short
    dir: .

  # ------------------------------------------------------------------
  # Step 2: Build Docker image
  # ------------------------------------------------------------------
  - name: gcr.io/cloud-builders/docker
    id: build-image
    args:
      - build
      - -f
      - deploy/Dockerfile
      - -t
      - ${_REGISTRY}/${_PROJECT_ID}/${_REPO}/insurbot-api:${SHORT_SHA}
      - -t
      - ${_REGISTRY}/${_PROJECT_ID}/${_REPO}/insurbot-api:latest
      - .
    waitFor:
      - unit-tests

  # ------------------------------------------------------------------
  # Step 3: Push image to Artifact Registry
  # ------------------------------------------------------------------
  - name: gcr.io/cloud-builders/docker
    id: push-image
    args:
      - push
      - --all-tags
      - ${_REGISTRY}/${_PROJECT_ID}/${_REPO}/insurbot-api
    waitFor:
      - build-image

  # ------------------------------------------------------------------
  # Step 4: Deploy to Cloud Run
  # ------------------------------------------------------------------
  - name: gcr.io/cloud-builders/gcloud
    id: deploy-cloud-run
    args:
      - run
      - deploy
      - ${_SERVICE_NAME}
      - --image=${_REGISTRY}/${_PROJECT_ID}/${_REPO}/insurbot-api:${SHORT_SHA}
      - --region=${_REGION}
      - --project=${_PROJECT_ID}
      - --platform=managed
      - --no-allow-unauthenticated
      - --service-account=insurbot-sa@${_PROJECT_ID}.iam.gserviceaccount.com
      - --set-env-vars=GCP_PROJECT_ID=${_PROJECT_ID},GCP_REGION=${_REGION},BQ_DATASET=insurbot,BQ_LOCATION=US,VERTEX_MODEL_ID=gemini-1.5-pro,LOG_LEVEL=INFO
      - --port=8080
      - --memory=512Mi
      - --cpu=1
      - --max-instances=3
      - --timeout=60
    waitFor:
      - push-image

images:
  - ${_REGISTRY}/${_PROJECT_ID}/${_REPO}/insurbot-api:${SHORT_SHA}
  - ${_REGISTRY}/${_PROJECT_ID}/${_REPO}/insurbot-api:latest
